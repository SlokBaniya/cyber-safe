<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cyber Safe: Learn and Quiz</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Public+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #eef3f1;
        --ink: #10222b;
        --mute: #4d6470;
        --card: #fff;
        --line: #c9d7d3;
        --acc: #0b6e66;
        --aI: #fff;
        --ok: #1b7f3b;
        --bad: #b3261e;
        --warn: #f2b705;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0d1a1f;
          --ink: #e6efed;
          --mute: #9bb2ba;
          --card: #14272e;
          --line: #27424b;
          --acc: #3fd0c0;
          --aI: #06201d;
          --ok: #5fd68a;
          --bad: #ff8a80;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 400 1.02rem/1.6 "Public Sans", system-ui, sans-serif;
      }
      h1, h2, h3, .brand {
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        line-height: 1.1;
        margin: 0 0 0.5em;
      }
      header {
        display: flex;
        align-items: center;
        gap: 1rem;
        flex-wrap: wrap;
        padding: 0.7rem 1.2rem;
        border-bottom: 2px solid var(--ink);
        position: sticky;
        top: 0;
        background: var(--bg);
        z-index: 5;
      }
      .brand {
        font-weight: 800;
        font-size: 1.3rem;
        margin: 0 auto 0 0;
      }
      nav a {
        color: var(--ink);
        text-decoration: none;
        font-weight: 600;
        padding: 0.4rem 0.8rem;
        border-radius: 6px;
        border: 2px solid transparent;
      }
      nav a.on, nav a:hover {
        border-color: var(--ink);
      }
      main {
        max-width: 62rem;
        margin: 0 auto;
        padding: 1.8rem 1.2rem 4rem;
        outline: none;
      }
      h1 {
        font-size: clamp(2.2rem, 7vw, 3.8rem);
        font-weight: 800;
      }
      h2 {
        font-size: clamp(1.5rem, 4vw, 2.1rem);
        font-weight: 800;
      }
      .lede {
        color: var(--mute);
        font-size: 1.15rem;
        max-width: 60ch;
      }
      .btn {
        background: var(--acc);
        color: var(--aI);
        border: 2px solid var(--ink);
        border-radius: 8px;
        padding: 0.6rem 1.1rem;
        font: 600 1rem "Public Sans", sans-serif;
        cursor: pointer;
        box-shadow: 3px 3px 0 var(--ink);
        text-decoration: none;
        display: inline-block;
        transition: transform 0.1s ease, box-shadow 0.1s ease;
      }
      .btn:hover {
        transform: translate(1px, 1px);
        box-shadow: 2px 2px 0 var(--ink);
      }
      .btn.g {
        background: transparent;
        color: var(--ink);
      }
      :focus-visible {
        outline: 3px solid var(--warn);
        outline-offset: 2px;
      }
      .row {
        display: flex;
        gap: 0.7rem;
        flex-wrap: wrap;
        margin: 1.2rem 0;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(17rem, 1fr));
        gap: 1rem;
        margin-top: 1.5rem;
      }
      .card {
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: 10px;
        padding: 1rem 1.1rem;
      }
      .card h3 {
        font-size: 1.2rem;
        margin: 0;
      }
      .card p {
        margin: 0.4rem 0;
        color: var(--mute);
      }
      .tg {
        background: none;
        border: 0;
        color: var(--acc);
        font: 600 0.95rem inherit;
        cursor: pointer;
        padding: 0;
        text-decoration: underline;
      }
      .card ul {
        padding-left: 1.1rem;
        margin: 0.6rem 0;
      }
      .card li {
        margin: 0.35rem 0;
      }
      .topic-figure {
        background: var(--card);
        border: 2px solid var(--line);
        border-radius: 10px;
        overflow: hidden;
        margin: 1.5rem 0;
        box-shadow: 2px 2px 0 var(--line);
      }
      .topic-figure img {
        width: 100%;
        height: 220px;
        object-fit: cover;
        display: block;
      }
      .topic-figure figcaption {
        font-size: 0.9rem;
        color: var(--mute);
        padding: 0.8rem 1rem;
        font-weight: 600;
        background: color-mix(in srgb, var(--acc) 5%, var(--card));
        border-top: 1px solid var(--line);
      }
      .example-box {
        background: color-mix(in srgb, var(--acc) 8%, var(--card));
        border-left: 5px solid var(--acc);
        padding: 1rem 1.2rem;
        margin: 1rem 0;
        border-radius: 0 8px 8px 0;
      }
      .example-box h4 {
        margin: 0 0 0.4rem;
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        color: var(--ink);
        font-size: 1.05rem;
      }
      .example-box p {
        margin: 0;
        color: var(--ink);
      }
      .quiz {
        display: grid;
        grid-template-columns: 1fr 16rem;
        gap: 1.2rem;
        align-items: start;
      }
      @media (max-width: 760px) {
        .quiz {
          grid-template-columns: 1fr;
        }
      }
      .meta {
        color: var(--mute);
        font-weight: 600;
        margin: 0 0 0.4rem;
      }
      .opt, .dropdown-select {
        display: block;
        width: 100%;
        text-align: left;
        margin: 0.55rem 0;
        padding: 0.75rem 1rem;
        background: var(--card);
        color: var(--ink);
        border: 2px solid var(--line);
        border-radius: 8px;
        font: inherit;
        cursor: pointer;
      }
      .dropdown-select {
        cursor: pointer;
        appearance: none;
        background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
        background-repeat: no-repeat;
        background-position: right 1rem center;
        background-size: 1.1em;
      }
      .opt:hover:not(:disabled) {
        border-color: var(--ink);
      }
      .opt.r {
        border-color: var(--ok);
        background: color-mix(in srgb, var(--ok) 18%, var(--card));
      }
      .opt.w {
        border-color: var(--bad);
        background: color-mix(in srgb, var(--bad) 18%, var(--card));
      }
      .sb {
        position: sticky;
        top: 4.5rem;
      }
      .sb h3 {
        font-size: 1.1rem;
      }
      .stat {
        display: flex;
        justify-content: space-between;
        padding: 0.25rem 0;
        border-bottom: 1px solid var(--line);
      }
      .stat b {
        font-variant-numeric: tabular-nums;
      }
      .big {
        font: 800 3rem "Bricolage Grotesque", sans-serif;
        line-height: 1;
      }
      .bar {
        height: 10px;
        border: 2px solid var(--ink);
        border-radius: 6px;
        overflow: hidden;
        margin: 0.5rem 0;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--acc);
        transition: width 0.3s;
      }
      .tb {
        display: grid;
        grid-template-columns: 7rem 1fr 2.6rem;
        gap: 0.5rem;
        align-items: center;
        font-size: 0.9rem;
        margin: 0.3rem 0;
      }
      .tb .bar {
        margin: 0;
        height: 8px;
      }
      .score {
        font: 800 clamp(4.5rem, 16vw, 7.5rem) "Bricolage Grotesque", sans-serif;
        line-height: 1;
      }
      .miss {
        border-left: 5px solid var(--bad);
        padding: 0.4rem 0.8rem;
        margin: 0.7rem 0;
        background: var(--card);
        border-radius: 0 8px 8px 0;
      }
      .btn[disabled] {
        opacity: 0.45;
        cursor: not-allowed;
        box-shadow: none;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin: 0.6rem 0 1.4rem;
      }
      .chips .btn {
        padding: 0.35rem 0.8rem;
        font-size: 0.9rem;
        box-shadow: none;
      }
      .chap h3 {
        margin: 1.5rem 0 0.3rem;
        font-size: 1.3rem;
      }
      .chap p {
        max-width: 68ch;
      }
      .cn {
        color: var(--mute);
        font-weight: 600;
        font-size: 0.9rem;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
        }
      }
    </style>
  </head>

        let right = 0,
          wrong = 0,
          streak = 0,
          best = 0,
          by = TOPICS.map(() => [0, 0]),
          miss = [];
        S.list.forEach((q, k) => {
          const a = S.ans[k];
          if (a === null) return;
          const y = S.opts[k][a];
          by[q.t][1]++;
          if (y === q.a) {
            right++;
            by[q.t][0]++;
            streak++;
            best = Math.max(best, streak);
          } else {
            wrong++;
            streak = 0;
            miss.push({ q: q.q, a: q.a, y });
          }
        });
        return { right, wrong, streak, best, by, miss };
      }

      function sb(st) {
        const n = st.right + st.wrong,
          acc = n ? Math.round((st.right / n) * 100) : 0;
        return `<aside class="card sb" aria-label="Live scoreboard"><h3>Live scoreboard</h3><div class="big">${st.right}</div>
  <div class="bar"><i style="width:${(n / S.list.length) * 100}%"></i></div>
  <div class="stat"><span>Answered</span><b>${n}/${S.list.length}</b></div><div class="stat"><span>Correct</span><b>${st.right}</b></div>
  <div class="stat"><span>Wrong</span><b>${st.wrong}</b></div><div class="stat"><span>Accuracy</span><b>${acc}%</b></div>
  <div class="stat"><span>Streak</span><b>${st.streak}</b></div><div class="stat"><span>Best streak</span><b>${st.best}</b></div></aside>`;
      }

      function quiz() {
        if (!S) {
          app.innerHTML = `<h1>${last ? "Take another quiz" : "Take the quiz"}</h1><p class="lede">Questions are picked at random every time. Leaving this page restarts the quiz.</p>
    <div class="row"><button class="btn" data-go="all">Main quiz (20 random questions)</button></div>
    <p class="meta">Or take a chapter quiz (10 random questions):</p><div class="chips">${TOPICS.map((t, i) => `<button class="btn g" data-go="t${i}">${i + 1}.${t.n}</button>`).join("")}</div>
    ${last ? `<div class="card"><p class="meta">Your last result · ${E(last.title)}</p><div class="big">${Math.round((last.right / last.tot) * 100)}%</div><p>${last.right} of${last.tot} correct · best streak ${last.best}</p><a class="btn g" href="#results">View full results</a></div>` : ""}`;
          return;
        }
        const k = S.i,
          q = S.list[k],
          a = S.ans[k],
          done = a !== null,
          end = k === S.list.length - 1,
          st = stats();

        let inputHtml = "";
        if (q.isDropdown) {
          inputHtml = `<select class="dropdown-select" id="dropdown-answer" ${done ? "disabled" : ""}><option value="">-- Select correct option --</option>${S.opts[k].map((o, j) => `<option value="${j}" ${done && a === j ? "selected" : ""}>${E(o)}</option>`).join("")}</select>`;
          if (!done) {
            setTimeout(() => {
              const sel = $("#dropdown-answer");
              if (sel) {
                sel.onchange = (e) => {
                  if (e.target.value !== "") pick(+e.target.value);
                };
              }
            }, 0);
          }
        } else {
          inputHtml = S.opts[k].map((o, j) => `<button class="opt ${done ? (o === q.a ? "r" : j === a ? "w" : "") : ""}" data-pick="${j}" ${done ? "disabled" : ""}>${E(o)}</button>`).join("");
        }

        app.innerHTML = `<div class="quiz"><section><p class="meta">${E(S.title)} · Question ${k + 1} of ${S.list.length} · ${TOPICS[q.t].n}</p><h2>${E(q.q)}</h2>
  ${inputHtml}
  <div aria-live="polite" class="meta" style="margin-top:0.8rem">${done ? (S.opts[k][a] === q.a ? "Correct!" : "Not quite. The correct answer is highlighted.") : "Choose or select an answer."}</div>
  <div class="row"><button class="btn g" id="prev" ${k === 0 ? "disabled" : ""}>Previous</button>
  <button class="btn" id="next" ${done ? "" : "disabled"}>${end ? "Finish and see results" : "Next question"}</button></div></section>${sb(st)}</div>`;
        if (done && !q.isDropdown) $("#next").focus();
      }

      function pick(j) {
        if (S.ans[S.i] !== null) return;
        S.ans[S.i] = j;
        quiz();
      }

      function go(d) {
        if (d > 0 && S.ans[S.i] === null) return;
        if (d > 0 && S.i === S.list.length - 1) {
          const st = stats();
          last = {
            title: S.title,
            right: st.right,
            tot: S.list.length,
            best: st.best,
            by: st.by,
            miss: st.miss,
          };
          try {
            localStorage.setItem("cyberLast", JSON.stringify(last));
          } catch (e) {}
          S = null;
          location.hash = "results";
          return;
        }
        S.i = Math.max(0, S.i + d);
        quiz();
      }

      function results() {
        if (!last) {
          app.innerHTML = `<h1>Take the quiz first</h1><p class="lede">You haven't finished a quiz yet. Your score and feedback will appear here.</p><div class="row"><a class="btn" href="#quiz">Take the quiz</a><a class="btn g" href="#topics">Read the topics</a></div>`;
          return;
        }
        const R = last,
          tot = R.tot,
          pct = Math.round((R.right / tot) * 100);
        const [h, m] =
          pct >= 90
            ? [
                "Cyber champion",
                "You spot threats fast. Teach someone else what you know.",
              ]
            : pct >= 70
              ? [
                  "Safe and sharp",
                  "Solid habits. Review the topics below with lower scores.",
                ]
              : pct >= 50
                ? [
                    "Getting there",
                    "You know the basics. Re-read the weaker topics and try again.",
                  ]
                : [
                    "Time to review",
                    "Read through the topics again, then retake the quiz.",
                  ];
        app.innerHTML = `<p class="meta">${E(R.title)} results</p><div class="score">${pct}%</div><h2>${h}</h2><p class="lede">${m} You got ${R.right} of ${tot} right. Best streak: ${R.best}.</p>
  <h3>Score by topic</h3>${TOPICS.map((t, i) => (R.by[i][1] ? `<div class="tb"><a href="#topic/${i + 1}" style="color:inherit">${i + 1}.${t.n.split(" ").slice(0, 2).join(" ")}</a><div class="bar"><i style="width:${(R.by[i][0] / R.by[i][1]) * 100}%"></i></div><b>${R.by[i][0]}/${R.by[i][1]}</b></div>` : "")).join("")}
  <div class="row"><a class="btn" href="#quiz">Take another quiz</a><a class="btn g" href="#topics">Review topics</a></div>
  ${R.miss.length ? `<h3>Questions to review (${R.miss.length})</h3>${R.miss.map((x) => `<div class="miss"><b>${E(x.q)}</b><br>Your answer: ${E(x.y)}<br>Correct: ${E(x.a)}</div>`).join("")}` : "<p>No missed questions. Great job!</p>"}`;
      }

      app.addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        const d = b.dataset;
        if (d.go) start(d.go);
        else if (d.open !== undefined) {
          open = open === +d.open ? -1 : +d.open;
          topics();
        } else if (d.pick !== undefined) pick(+d.pick);
        else if (b.id === "next") go(1);
        else if (b.id === "prev") go(-1);
      });

      $("#nav").addEventListener("click", (e) => {
        const a = e.target.closest("a");
        if (a && a.hash === "#quiz" && location.hash === "#quiz") {
          S = null;
          quiz();
          window.scrollTo(0, 0);
        }
      });

      function route() {
        const [p, a] = (location.hash.slice(1) || "topics").split("/"),
          n = +a - 1;
        if (p !== "quiz") S = null;
        const on = p === "topic" ? "topics" : p;
        document
          .querySelectorAll("#nav a")
          .forEach((x) => x.classList.toggle("on", x.hash === "#" + on));
        if (p === "topic" && n >= 0 && n < TOPICS.length) chapter(n);
        else (({ quiz, results })[p] || topics)();
        window.scrollTo(0, 0);
      }

      addEventListener("hashchange", route);
      route();
    </script>
  </body>
</html>
